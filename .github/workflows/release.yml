name: Release

# git tag v0.1.0 && git push origin v0.1.0
#   → build Windows installer
#   → create GitHub Release
#   → upload Sourney-Setup.exe
# README "Download Latest" always points at that file.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          echo "Building Sourney v${VERSION}"

      - name: Build Windows installer
        run: npm run build -- --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          name: Sourney ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**/Sourney-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
